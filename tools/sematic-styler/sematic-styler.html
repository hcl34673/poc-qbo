<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sematic Styler</title>
  <style>
    body { font: 14px sans-serif; margin: 0; padding: 12px; }
    #status { color: #666; margin-bottom: 8px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin: 0 0 6px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .role { font-weight: 600; font-family: monospace; }
    .text { color: #555; margin-top: 2px; word-break: break-word; white-space: pre-line; }
    .size { display: block; margin-top: 6px; font: 12px monospace; }
    .size select { margin-left: 6px; }
  </style>
</head>
<body>
  <div id="status">Select content in the document.</div>
  <button id="repair" type="button">Check heading keys</button>
  <ul id="list"></ul>
  <script type="module" src="./sematic-styler.js"></script>
</body>
</html>
